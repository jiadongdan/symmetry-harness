[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "symmetry-harness"
version = "0.2.3"
description = "Cross-agent harness for interactive few-shot symmetry analysis"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.23",
    "Pillow>=9.0",
]

[project.urls]
Homepage = "https://github.com/jiadongdan/symmetry-harness"
Repository = "https://github.com/jiadongdan/symmetry-harness.git"
Issues = "https://github.com/jiadongdan/symmetry-harness/issues"

[project.optional-dependencies]
ui = ["gradio>=5"]
dev = ["pytest>=8"]

[project.scripts]
symmetry = "symmetry_harness.cli:main"
symmetry-harness = "symmetry_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
symmetry_harness = ["templates/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# The default run is the fast unit suite. The two real-Provider integration
# suites cost several minutes each (they spawn the Provider subprocess, compute
# real features, and fit real scikit-learn / torch models), so they are
# deselected here and run explicitly:
#   python -m pytest -m traditional_integration
#   python -m pytest -m prediction_integration
# CI runs both in dedicated jobs; see .github/workflows/ci.yml.
addopts = "-m 'not traditional_integration and not prediction_integration'"
markers = [
    "traditional_integration: real cross-repository Provider traditional ML tests (must never be skipped)",
    "prediction_integration: real fine-tuned-model prediction through the Provider worker (uses torch, CPU-only)",
]
