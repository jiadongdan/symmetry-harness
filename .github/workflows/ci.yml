name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[dev]"
      - run: python -m pytest -q -m "not traditional_integration"
      - run: symmetry --help

  ui-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install ".[ui,dev]"
      - run: python -m pytest -q -k gradio_interface_builds

  provider-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # The Provider is installed from a source checkout rather than from
      # `git+https://...`, because symmetry-learn depends on
      # `symmetry-learn-default-model==1.0.0`, which is not on PyPI yet. The
      # model package has to be installed from its subdirectory first, exactly
      # as symmetry-learn's own CI does.
      - uses: actions/checkout@v4
        with:
          repository: jiadongdan/symmetry-learn
          ref: main
          path: symmetry-learn
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install ".[dev]"
      - run: python -m pip install -e symmetry-learn/model_packages/symmetry_learn_default_model
      - run: python -m pip install -e symmetry-learn
      - run: python -m pytest -q tests/test_prediction_integration.py

  # Dedicated cross-repository traditional ML job. It installs both repositories
  # plus torch and scikit-learn, then runs the real (never-skipped) integration
  # tests by marker. The Provider installed here must expose the
  # `traditional_ml_analyze` operation; otherwise the tests fail loudly instead
  # of passing as a silent skip. Like provider-integration, it installs the
  # Provider from a source checkout because the default model package is not on
  # PyPI yet.
  traditional-ml-integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: jiadongdan/symmetry-learn
          ref: main
          path: symmetry-learn
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install --index-url https://download.pytorch.org/whl/cpu torch
      - run: python -m pip install "scikit-learn>=1.3"
      - run: python -m pip install ".[dev]"
      - run: python -m pip install -e symmetry-learn/model_packages/symmetry_learn_default_model
      - run: python -m pip install -e symmetry-learn
      - run: python -m pytest -q -m traditional_integration tests/test_traditional_integration.py
